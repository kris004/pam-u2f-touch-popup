# SPDX-License-Identifier: GPL-3.0-or-later

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.cc }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
      CFLAGS: -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: make
      - name: Test
        run: make test
      - name: Check staged installation
        run: |
          stage="$(mktemp -d)"
          make \
            DESTDIR="$stage" \
            PREFIX=/usr \
            BINDIR=/usr/libexec \
            SETUPDIR=/usr/bin \
            UNITDIR=/usr/lib/systemd/user \
            DOCDIR=/usr/share/doc/pam-u2f-touch-popup \
            install
          test -x "$stage/usr/libexec/pam-u2f-touch-popup"
          test -x "$stage/usr/bin/pam-u2f-touch-popup-setup"
          grep -Fx 'ExecStart=/usr/libexec/pam-u2f-touch-popup' \
            "$stage/usr/lib/systemd/user/pam-u2f-touch-popup.service"
          grep -Fx 'ExecStart=/usr/libexec/pam-u2f-touch-popup' \
            "$stage/usr/lib/systemd/user/pam-u2f-touch-popup-device.service"
          grep -Fx 'PathExists=/dev/pam-u2f-touch-popup-key' \
            "$stage/usr/lib/systemd/user/pam-u2f-touch-popup-device.path"
          test -f \
            "$stage/usr/share/doc/pam-u2f-touch-popup/examples/70-pam-u2f-touch-popup-device-gate.rules"
      - name: Check release packaging
        if: matrix.cc == 'gcc'
        run: |
          git \
            -c user.name='Packaging test' \
            -c user.email='packaging-test@example.invalid' \
            tag -a package-test-ref -m 'Packaging test ref'
          RELEASE_REF=package-test-ref make \
            VERSION=v0.0.0 \
            RELEASE_TARGET=linux-x86_64-test \
            dist
          (cd dist && sha256sum --check SHA256SUMS)
          binary_archive=dist/pam-u2f-touch-popup-0.0.0-linux-x86_64-test.tar.gz
          source_archive=dist/pam-u2f-touch-popup-0.0.0-src.tar.gz
          tar -tzf "$binary_archive" > binary-archive.list
          tar -tzf "$source_archive" > source-archive.list
          cat binary-archive.list
          cat source-archive.list
          grep -Fqx \
            'pam-u2f-touch-popup-0.0.0-linux-x86_64-test/bin/pam-u2f-touch-popup-setup' \
            binary-archive.list
          grep -Fqx \
            'pam-u2f-touch-popup-0.0.0-linux-x86_64-test/share/systemd/user/pam-u2f-touch-popup-device.path' \
            binary-archive.list
          grep -Fqx \
            'pam-u2f-touch-popup-0.0.0-linux-x86_64-test/share/systemd/user/pam-u2f-touch-popup-device.service' \
            binary-archive.list
          grep -Fqx \
            'pam-u2f-touch-popup-0.0.0-linux-x86_64-test/share/doc/pam-u2f-touch-popup/examples/70-pam-u2f-touch-popup-device-gate.rules' \
            binary-archive.list
          grep -Fqx \
            'pam-u2f-touch-popup-0.0.0/examples/70-pam-u2f-touch-popup-device-gate.rules' \
            source-archive.list
          before=$(sha256sum dist/*)
          if RELEASE_REF=package-test-ref make \
            VERSION=v0.0.0 \
            RELEASE_TARGET=linux-x86_64-test \
            dist; then
            echo 'packaging unexpectedly overwrote existing assets' >&2
            exit 1
          fi
          test "$before" = "$(sha256sum dist/*)"

          collision_dir=$(mktemp -d)
          trap 'rm -rf "$collision_dir"' EXIT
          ln -s missing \
            "$collision_dir/pam-u2f-touch-popup-0.0.0-linux-x86_64-test.tar.gz"
          if OUTPUT_DIR="$collision_dir" RELEASE_REF=package-test-ref make \
            VERSION=v0.0.0 \
            RELEASE_TARGET=linux-x86_64-test \
            dist; then
            echo 'packaging unexpectedly replaced a dangling symlink' >&2
            exit 1
          fi

  sanitizers:
    name: Sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CC: clang
      CFLAGS: >-
        -std=c11 -O1 -g -Wall -Wextra -Wpedantic
        -fno-omit-frame-pointer -fsanitize=address,undefined
      LDFLAGS: -fsanitize=address,undefined
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test with sanitizers
        run: make test

  static-release:
    name: Static release build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CC: musl-gcc
      CFLAGS: >-
        -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror
        -fPIE -fstack-protector-strong
      LDFLAGS: -static-pie -s -Wl,-z,relro,-z,now
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install \
            --yes \
            --no-install-recommends \
            binutils \
            file \
            musl-tools
      - name: Build, test, and inspect release binary
        run: |
          make test
          ./scripts/check-static-pie.sh pam-u2f-touch-popup
