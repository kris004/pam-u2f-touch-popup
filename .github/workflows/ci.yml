name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
      CFLAGS: -std=c11 -O2 -Wall -Wextra -Wpedantic -Werror
    steps:
      - uses: actions/checkout@v6
      - name: Build
        run: make
      - name: Test
        run: make test
      - name: Check staged installation
        run: |
          stage="$(mktemp -d)"
          make DESTDIR="$stage" PREFIX=/usr install
          test -x "$stage/usr/bin/pam-u2f-touch-popup"
          grep -Fx 'ExecStart=/usr/bin/pam-u2f-touch-popup' \
            "$stage/usr/share/systemd/user/pam-u2f-touch-popup.service"
      - name: Check release packaging
        if: matrix.cc == 'gcc'
        run: |
          make \
            VERSION=v0.0.0 \
            RELEASE_TARGET=linux-x86_64-test \
            dist
          (cd dist && sha256sum --check SHA256SUMS)
          tar -tzf \
            dist/pam-u2f-touch-popup-0.0.0-linux-x86_64-test.tar.gz
          tar -tzf \
            dist/pam-u2f-touch-popup-0.0.0-src.tar.gz

  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CC: clang
      CFLAGS: >-
        -std=c11 -O1 -g -Wall -Wextra -Wpedantic
        -fno-omit-frame-pointer -fsanitize=address,undefined
      LDFLAGS: -fsanitize=address,undefined
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v6
      - name: Build and test with sanitizers
        run: make test
